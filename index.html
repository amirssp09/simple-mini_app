<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Music Player 🎵</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f4f8;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h2 {
      color: #0088cc;
      margin-bottom: 10px;
    }

    .q {
      font-size: larger;
      margin-bottom: 15px;
    }

    audio {
      width: 90%;
      max-width: 400px;
      margin-top: 15px;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background-color: #0088cc;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s;
      touch-action: manipulation;
    }

    button:hover, button:active {
      background-color: #006fa1;
    }

    #track-name {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>🎧 پخش‌کننده موزیک تلگرام</h2>
  <p class="q">فعلاً فقط آهنگ‌های حبیب داریم 😄</p>

  <p id="track-name">در حال پخش: آهنگ اول</p>

  <audio id="player" controls playsinline>
    <source id="audioSource" src="https://irsv.upmusics.com/dlw/Habib%20-%203%20Rooze%20Raftee%20(320).mp3" type="audio/mp3">
    مرورگر شما از پخش موزیک پشتیبانی نمی‌کند.
  </audio>

  <div class="controls">
    <button id="prevBtn">⏮ قبلی</button>
    <button id="nextBtn">⏭ بعدی</button>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const songs = [
      { name: "آهنگ اول", url: "https://irsv.upmusics.com/dlw/Habib%20-%203%20Rooze%20Raftee%20(320).mp3" },
      { name: "آهنگ دوم", url: "https://irsv.upmusics.com/AliBZ/Mishnavi%20Sedaye%20Ghalbam%20Remix%20(320).mp3" },
      { name: "آهنگ سوم", url: "https://irsv.upmusics.com/AliBZ/Habib%20%7C%20Bzn%20Baran%20(320).mp3" }
    ];

    let current = 0;
    const player = document.getElementById("player");
    const trackName = document.getElementById("track-name");
    const audioSource = document.getElementById("audioSource");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");

    function playSong(index) {
      const song = songs[index];
      trackName.textContent = "در حال پخش: " + song.name;
      audioSource.src = song.url;
      player.load();
      player.play().catch(err => console.log("پخش مسدود شد:", err));
    }

    function next() {
      current = (current + 1) % songs.length;
      playSong(current);
    }

    function prev() {
      current = (current - 1 + songs.length) % songs.length;
      playSong(current);
    }

    // هم برای دسکتاپ و هم موبایل (تلگرام)
    nextBtn.addEventListener("click", next);
    prevBtn.addEventListener("click", prev);

    nextBtn.addEventListener("touchend", e => {
      e.preventDefault();
      next();
    });

    prevBtn.addEventListener("touchend", e => {
      e.preventDefault();
      prev();
    });
  </script>
</body>
</html>

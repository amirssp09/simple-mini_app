<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini App ساده تلگرام</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f8f9fa;
    }
    h1 {
      color: #0088cc;
    }
    button {
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #006fa1;
    }
  </style>
</head>
<body>
  <h1>👋 سلام!</h1>
  <p>این یه مینی‌اپ خیلی ساده تلگرامه</p>
  <button onclick="sayHello()">بزن منو 😄</button>

  <script>
    function sayHello() {
      alert("سلام از مینی‌اپ تلگرام!");
    }
  </script>
</body>
</html>
